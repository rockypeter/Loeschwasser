name: Punkte aktualisieren und veröffentlichen
on:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Löschwasserpunkte von Overpass holen
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, time, datetime, urllib.request, urllib.parse
          S, W, N, E = 51.78, 14.05, 51.98, 14.38
          MIRRORS = ["https://overpass-api.de/api/interpreter",
                     "https://maps.mail.ru/osm/tools/overpass/api/interpreter",
                     "https://overpass.private.coffee/api/interpreter"]
          UA = "FFW-Schmogrow-Loeschwasser-Karte/1.0 (GitHub Actions, taeglicher Abruf)"
          TYPES = "fire_hydrant|suction_point|water_well|water_tank|fire_water_pond"
          def fetch(bbox):
              q = f'[out:json][timeout:120];nwr["emergency"~"^({TYPES})$"]({bbox});out body center qt;'
              errs = []
              for attempt in range(3):
                  for url in MIRRORS:
                      try:
                          req = urllib.request.Request(url, data=urllib.parse.urlencode({"data": q}).encode(), headers={"User-Agent": UA})
                          with urllib.request.urlopen(req, timeout=150) as r:
                              d = json.load(r)
                          if "error" in (d.get("remark") or "").lower():
                              raise Exception(d["remark"][:80])
                          return d["elements"]
                      except Exception as e:
                          errs.append(url.split("/")[2] + ": " + str(e)); time.sleep(5)
                  time.sleep(30)
              raise SystemExit("Fehler: " + " | ".join(errs[-6:]))
          pts = {}
          rows, cols = 2, 3
          for i in range(rows):
              for j in range(cols):
                  b = f"{S+(N-S)*i/rows:.5f},{W+(E-W)*j/cols:.5f},{S+(N-S)*(i+1)/rows:.5f},{W+(E-W)*(j+1)/cols:.5f}"
                  for el in fetch(b):
                      c = el.get("center") or {}
                      lat, lon = el.get("lat", c.get("lat")), el.get("lon", c.get("lon"))
                      if lat is None or lon is None:
                          continue
                      uid = f'{el["type"]}/{el["id"]}'
                      pts[uid] = {"uid": uid, "id": el["id"], "osmType": el["type"], "lat": lat, "lon": lon, "tags": el.get("tags", {})}
                  time.sleep(3)
          if not pts:
              raise SystemExit("keine Punkte erhalten")
          out = {"generated": datetime.datetime.now(datetime.timezone.utc).isoformat(), "points": list(pts.values())}
          json.dump(out, open("points.json", "w"), ensure_ascii=False, separators=(",", ":"))
          print(len(pts), "Punkte gespeichert")
          PY

      - name: points.json im Repository sichern
        run: |
          if [ -f points.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add points.json
            if ! git diff --cached --quiet; then
              git commit -m "Punkte aktualisiert"
              git push
            fi
          fi

      - uses: actions/configure-pages@v5

      - name: Seite zusammenstellen
        run: |
          mkdir _site
          cp index.html sw.js manifest.webmanifest icon-192.png icon-512.png _site/
          if [ -f points.json ]; then cp points.json _site/; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
